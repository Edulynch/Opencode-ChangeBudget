name: Feature request
description: Suggest a focused improvement for ChangeBudget.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful behavior or interface.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds have you considered?
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope and tradeoffs
      description: Explain affected workflows, compatibility concerns, or deliberate non-goals.
    validations:
      required: false
