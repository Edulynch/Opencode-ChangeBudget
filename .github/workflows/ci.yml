name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-ubuntu:
    name: Validate (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.16.0 --no-fund --no-audit

      - name: Verify toolchain
        run: |
          node --input-type=module -e "import { execFileSync } from 'node:child_process'; const npmCommand = process.platform === 'win32' ? (process.env.ComSpec || 'cmd.exe') : 'npm'; const npmArgs = process.platform === 'win32' ? ['/D', '/S', '/C', 'npm --version'] : ['--version']; const version = execFileSync(npmCommand, npmArgs, { encoding: 'utf8', shell: false }).trim(); if (version !== '11.16.0') { console.error('Expected npm 11.16.0, found ' + version); process.exit(1); }"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run full test suite
        run: npm test

      - name: Validate package contents
        run: npm pack --dry-run --json --ignore-scripts

      - name: Verify required and forbidden runtime paths
        run: |
          node --input-type=module -e "import { execFileSync } from 'node:child_process'; const files = execFileSync('git', ['ls-files'], { encoding: 'utf8' }).split(/\r?\n/).filter(Boolean); const required = ['dist/src/cli/index.js', 'dist/src/core/package-root.js', 'dist/src/core/update/npm.js', 'opencode-plugin/dist/opencode-plugin/src/index.js']; const forbidden = ['dist/tests/', 'opencode-plugin/dist/src/']; for (const path of required) { if (!files.includes(path)) throw new Error('Required runtime is not tracked: ' + path); } if (files.some((path) => forbidden.some((prefix) => path.startsWith(prefix)))) throw new Error('Forbidden generated output is tracked');"

      - name: Verify runtime zero drift
        run: git diff --exit-code -- dist/src opencode-plugin/dist/opencode-plugin

      - name: Run CI-safe release gate
        run: npm run ci:release-gate

      - name: Check repository hygiene
        run: git diff --check

  validate-windows:
    name: Validate (windows-latest shard ${{ matrix.shard }}/3)
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.16.0 --no-fund --no-audit

      - name: Verify toolchain
        run: |
          node --input-type=module -e "import { execFileSync } from 'node:child_process'; const npmCommand = process.platform === 'win32' ? (process.env.ComSpec || 'cmd.exe') : 'npm'; const npmArgs = process.platform === 'win32' ? ['/D', '/S', '/C', 'npm --version'] : ['--version']; const version = execFileSync(npmCommand, npmArgs, { encoding: 'utf8', shell: false }).trim(); if (version !== '11.16.0') { console.error('Expected npm 11.16.0, found ' + version); process.exit(1); }"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run Windows test shard
        run: node --test "--test-shard=${{ matrix.shard }}/3" "dist/tests/**/*.js"

      - name: Validate package contents
        if: matrix.shard == 1
        run: npm pack --dry-run --json --ignore-scripts

      - name: Verify required and forbidden runtime paths
        if: matrix.shard == 1
        run: |
          node --input-type=module -e "import { execFileSync } from 'node:child_process'; const files = execFileSync('git', ['ls-files'], { encoding: 'utf8' }).split(/\r?\n/).filter(Boolean); const required = ['dist/src/cli/index.js', 'dist/src/core/package-root.js', 'dist/src/core/update/npm.js', 'opencode-plugin/dist/opencode-plugin/src/index.js']; const forbidden = ['dist/tests/', 'opencode-plugin/dist/src/']; for (const path of required) { if (!files.includes(path)) throw new Error('Required runtime is not tracked: ' + path); } if (files.some((path) => forbidden.some((prefix) => path.startsWith(prefix)))) throw new Error('Forbidden generated output is tracked');"

      - name: Verify runtime zero drift
        if: matrix.shard == 1
        run: git diff --exit-code -- dist/src opencode-plugin/dist/opencode-plugin

      - name: Run CI-safe release gate
        if: matrix.shard == 1
        run: npm run ci:release-gate

      - name: Check repository hygiene
        if: matrix.shard == 1
        run: git diff --check
