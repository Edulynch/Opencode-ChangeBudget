name: Tagged Release Smoke

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Tagged smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out exact triggering tag
        # actions/checkout v7.0.0 = 9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v7.0.0 = 820762786026740c76f36085b0efc47a31fe5020
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0

      - name: Pin npm
        run: npm install --global npm@11.16.0 --no-fund --no-audit

      - name: Verify toolchain
        run: |
          node --input-type=module -e "import { execFileSync } from 'node:child_process'; const npmCommand = process.platform === 'win32' ? (process.env.ComSpec || 'cmd.exe') : 'npm'; const npmArgs = process.platform === 'win32' ? ['/D', '/S', '/C', 'npm --version'] : ['--version']; const version = execFileSync(npmCommand, npmArgs, { encoding: 'utf8', shell: false }).trim(); if (version !== '11.16.0') { console.error('Expected npm 11.16.0, found ' + version); process.exit(1); }"

      - name: Run tagged smoke
        env:
          CHANGE_BUDGET_SMOKE_AUTH_MODE: ${{ github.event.repository.private && 'private' || 'public' }}
          GITHUB_TOKEN: ${{ github.event.repository.private && secrets.GITHUB_TOKEN || '' }}
          CHANGE_BUDGET_TAG: ${{ github.ref_name }}
        run: npm run smoke:tagged
