name: Tagged Release Smoke

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Tagged smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out exact triggering tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Pin npm
        run: npm install --global npm@11.16.0 --no-fund --no-audit

      - name: Verify toolchain
        run: |
          node --input-type=module -e "import { execFileSync } from 'node:child_process'; const npm = process.platform === 'win32' ? 'npm.cmd' : 'npm'; const version = execFileSync(npm, ['--version'], { encoding: 'utf8' }).trim(); if (version !== '11.16.0') { console.error('Expected npm 11.16.0, found ' + version); process.exit(1); }"

      - name: Run tagged smoke
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGE_BUDGET_TAG: ${{ github.ref_name }}
        run: npm run smoke:tagged
